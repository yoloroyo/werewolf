{% extends 'base.html' %}

{% block title %}Подтверждение - Werewolf{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check display-3 text-info"></i>
                <h2 class="mb-2 mt-2">Подтверди почту</h2>
                <p class="text-body-secondary">Мы отправили 6-значный код на <strong>{{ email }}</strong>.</p>
                <form method="post">
                    {% csrf_token %}
                    {% include 'shop/auth/_form.html' %}
                    <button class="btn btn-primary w-100 btn-lg">Подтвердить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
