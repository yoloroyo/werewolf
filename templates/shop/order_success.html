{% extends 'base.html' %}

{% block title %}Заказ оформлен - Werewolf{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-check-circle text-success display-1"></i>
    <h1 class="mt-3">Спасибо за заказ!</h1>
    <p class="lead text-body-secondary">
        Ваш заказ <strong>#{{ order.pk }}</strong> успешно оформлен.<br>
        Мы свяжемся с вами по телефону {{ order.phone }}.
    </p>
    <p>Сумма заказа: <strong>{{ order.total }} ₽</strong></p>
    <a href="{% url 'shop:home' %}" class="btn btn-primary mt-3">Вернуться в каталог</a>
</div>
{% endblock %}
